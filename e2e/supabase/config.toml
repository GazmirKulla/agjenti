# Only used from .e2e-local/stack; never link this project to a hosted project.
project_id = "agjenti-e2e-local"
[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 55322
shadow_port = 55320
major_version = 17
[db.migrations]
# The local runner replays ALL files in order, retaining W0-B's review guard.
enabled = false
[db.seed]
enabled = false
[db.pooler]
enabled = false
[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 55324
[storage]
enabled = true
[storage.vector]
enabled = false
[storage.analytics]
enabled = false
[auth]
enabled = true
site_url = "http://localhost:3103"
additional_redirect_urls = ["http://localhost:3103/auth/callback"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
# CLI maps this to GOTRUE_EXTERNAL_EMAIL_ENABLED, including password login.
# Global auth.enable_signup=false still rejects public account registration.
enable_signup = true
enable_confirmations = false
[analytics]
enabled = false
[edge_runtime]
enabled = false
